# VAULT-STL-Reparatur als Einmal-Job. Ausführen:
#   docker compose run --rm vault-repair /vault /out --method numpy --workers 2
# Eingabe read-only gemountet, Ausgabe ins eigene Verzeichnis ./vault_repariert
# (vorher selbst anlegen: mkdir -p vault_repariert — sonst legt Docker es als root an)
services:
  vault-repair:
    build: .
    image: vault-repair
    # Dateien später dem Host-Nutzer gehören lassen; Werte aus .env (siehe INSTALL.md):
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./vault:/vault:ro
      - ./vault_repariert:/out
    # Resume-Datei (vault_stl_repair.json) liegt in /out -> überlebt Abbruch/Neustart
    # RAM: größte Module brauchen einige GB pro Worker; Deckel ist optional:
    # deploy: { resources: { limits: { memory: 16G } } }
